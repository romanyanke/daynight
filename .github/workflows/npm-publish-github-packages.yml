# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

env:
  # sun.ts derives a correction from the runner's local timezone offset
  # (Date.prototype.getTimezoneOffset()), so test results are only
  # deterministic when the runner's TZ is pinned.
  TZ: UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
      - run: npm ci
      # GitHub Packages only routes *scoped* package names to
      # npm.pkg.github.com (see actions/setup-node's generated .npmrc, which
      # maps `@<owner>:registry=...` rather than the default registry). The
      # public npm package name ("daynight") is unscoped, so publishing here
      # unscoped silently falls back to the default registry.npmjs.org with
      # no auth for it. Scope the name for this job only (ephemeral, not
      # committed) so it actually targets GitHub Packages.
      - run: npm pkg set name="@${{ github.repository_owner }}/daynight"
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

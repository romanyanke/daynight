# This workflow runs tests and then stages a publish of the package to the
# public npm registry via npm Trusted Publishing (OIDC) when a GitHub Release
# is created. The trusted publisher is configured to allow `npm stage publish`
# only (not a direct `npm publish`), so this never makes a version public by
# itself - a maintainer must separately run `npm stage approve <stage-id>`
# (2FA required) to release it. Requires npm CLI >= 11.15.0 (bundled with the
# Node version below).
name: Publish to npm

on:
  release:
    types: [created]

env:
  # sun.ts derives a correction from the runner's local timezone offset
  # (Date.prototype.getTimezoneOffset()), so test results are only
  # deterministic when the runner's TZ is pinned.
  TZ: UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm stage publish --access public
